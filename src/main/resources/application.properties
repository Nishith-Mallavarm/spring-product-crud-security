spring.application.name=demo
spring.port=8085
spring.datasource1.jdbc-url=jdbc:h2:~/demo
spring.datasource1.driver-class-name=org.h2.Driver
spring.datasource1.username=sa
spring.datasource1.password=
spring.h2.console.enabled=true
spring.jpa.show-sql=true
logging.level.org.springframework=INFO
logging.level.com.example=DEBUG
spring.datasource2.jdbc-url=jdbc:mysql://${DB2_HOST:localhost}:${DB2_PORT:9000}/${DB2_NAME:Nishith}?createDatabaseIfNotExist=true
spring.datasource2.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource2.username=root
spring.datasource2.password=root
# ===================================================================
# 1. ROOT LOGGING LEVEL
# ===================================================================
# Sets the default log level for libraries you don't explicitly configure
logging.level.root=INFO

# ===================================================================
# 2. YOUR APPLICATION LOGGING (Change package path if it differs)
# ===================================================================
# Set your custom code to DEBUG to see all your custom log statements
://level.com.example.demo=DEBUG

# ===================================================================
# 3. SPRING SECURITY LOGGING (Crucial for debugging 401/403 issues)
# ===================================================================
# Logs filter chain evaluations, matches, and authorization denials
logging.level.org.springframework.security=DEBUG
# Logs authentication attempts, user loading, and password matching
logging.level.org.springframework.security.authentication=DEBUG

# ===================================================================
# 4. DATABASE & CONNECTION POOL LOGGING
# ===================================================================
# Logs SQL statements executed by Hibernate
logging.level.org.hibernate.SQL=DEBUG
# Logs the actual values/parameters passed into SQL queries
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# ===================================================================
# 5. LOG FORMATTING (Optimised for Docker Console)
# ===================================================================
# Includes timestamp, log level, thread name, logger name, and message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
